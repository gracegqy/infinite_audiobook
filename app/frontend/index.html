<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Locked view (Grace, 2026-07-27): no pinch/double-tap zoom, no pan.
         maximum-scale/user-scalable are honored in the standalone PWA; in a
         Safari TAB iOS ignores them for accessibility, so the gesture handlers
         in main.jsx do the actual work there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#12121a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Readaloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
